name: CapyFlow
options:
  bundleIdPrefix: com.seph
  deploymentTarget:
    iOS: '17.0'
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    exactVersion: 0.4.9
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 11.15.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.2.0
targets:
  CapyFlow:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: YouTubeKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seph.capyflow
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 7
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: CapyFlow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    info:
      path: Info.plist
      properties:
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60]
            CFBundleIconName: AppIcon
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon20x20, AppIcon29x29, AppIcon40x40, AppIcon76x76, AppIcon83.5x83.5]
            CFBundleIconName: AppIcon
        CFBundleIconFiles: [AppIcon60x60]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.144576986614-vlb5n51v5u2angp0avm1c5p71av88u0a
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: CapyFlow uses your home network to reach your private streaming server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
