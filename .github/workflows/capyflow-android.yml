name: Build CapyFlow Android
on:
  push:
    branches: [feature/capyflow-android]
    paths: ['capyflow-android/**', '.github/workflows/capyflow-android.yml', 'firebase/**', 'firebase.json']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: .signing/capyflow-ci.jks
          key: capyflow-android-debug-signing-v2
      - name: Restore or initialize preview signing
        env:
          CAPYFLOW_ANDROID_KEYSTORE_BASE64: ${{ secrets.CAPYFLOW_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          if [ -n "$CAPYFLOW_ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$CAPYFLOW_ANDROID_KEYSTORE_BASE64" | base64 --decode > .signing/capyflow-ci.jks
          fi
          if [ ! -f .signing/capyflow-ci.jks ]; then
            if [ -f .github/capyflow-signing-sha1.txt ]; then
              echo '::error::Signing key is unavailable. Restore the existing keystore through CAPYFLOW_ANDROID_KEYSTORE_BASE64; refusing to replace it.'
              exit 1
            fi
            keytool -genkeypair -keystore .signing/capyflow-ci.jks -alias capyflow-ci -storepass android -keypass android -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=CapyFlow Preview,O=CapyFlow,C=PH'
          fi
          fingerprint=$(keytool -list -v -keystore .signing/capyflow-ci.jks -alias capyflow-ci -storepass android | sed -n 's/^[[:space:]]*SHA1: //p')
          echo "Preview signing SHA-1: $fingerprint"
          if [ -f .github/capyflow-signing-sha1.txt ]; then
            expected=$(tr -d '\r\n' < .github/capyflow-signing-sha1.txt)
            if [ "$fingerprint" != "$expected" ]; then
              echo '::error::Signing certificate does not match the registered preview key.'
              exit 1
            fi
          fi
      - name: Configure Firebase when supplied
        env:
          CAPYFLOW_ANDROID_FIREBASE_JSON: ${{ secrets.CAPYFLOW_ANDROID_FIREBASE_JSON }}
        run: |
          if [ -n "$CAPYFLOW_ANDROID_FIREBASE_JSON" ]; then
            printf '%s' "$CAPYFLOW_ANDROID_FIREBASE_JSON" > capyflow-android/app/google-services.json
          fi
      - name: Test and build
        env:
          CAPYFLOW_CI_KEYSTORE: ${{ github.workspace }}/.signing/capyflow-ci.jks
        working-directory: capyflow-android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CapyFlow-Android-dev8
          path: capyflow-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CapyFlow-Android-validation
          path: |
            capyflow-android/app/build/reports/tests/
            capyflow-android/app/build/reports/lint-results-debug.html

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: Test preview migration safety
        working-directory: capyflow-android
        run: node --test scripts/test-migrate-preview.mjs
      - name: Test shared Firebase rules
        working-directory: firebase
        run: npm ci && npm test
