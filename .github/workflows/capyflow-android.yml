name: Build CapyFlow Android
on:
  push:
    branches: [feature/capyflow-android]
    paths: ['backend/**', 'capyflow-android/**', '.github/workflows/capyflow-android.yml', 'firebase/**', 'firebase.json']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: .signing/capyflow-ci.jks
          key: capyflow-android-debug-signing-v2
      - name: Restore or initialize preview signing
        env:
          CAPYFLOW_ANDROID_KEYSTORE_BASE64: ${{ secrets.CAPYFLOW_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          if [ -n "$CAPYFLOW_ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$CAPYFLOW_ANDROID_KEYSTORE_BASE64" | base64 --decode > .signing/capyflow-ci.jks
          fi
          if [ ! -f .signing/capyflow-ci.jks ]; then
            if [ -f .github/capyflow-signing-sha1.txt ]; then
              echo '::error::Signing key is unavailable. Restore the existing keystore through CAPYFLOW_ANDROID_KEYSTORE_BASE64; refusing to replace it.'
              exit 1
            fi
            keytool -genkeypair -keystore .signing/capyflow-ci.jks -alias capyflow-ci -storepass android -keypass android -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=CapyFlow Preview,O=CapyFlow,C=PH'
          fi
          fingerprint=$(keytool -list -v -keystore .signing/capyflow-ci.jks -alias capyflow-ci -storepass android | sed -n 's/^[[:space:]]*SHA1: //p')
          echo "Preview signing SHA-1: $fingerprint"
          if [ -f .github/capyflow-signing-sha1.txt ]; then
            expected=$(tr -d '\r\n' < .github/capyflow-signing-sha1.txt)
            if [ "$fingerprint" != "$expected" ]; then
              echo '::error::Signing certificate does not match the registered preview key.'
              exit 1
            fi
          fi
      - name: Configure Firebase when supplied
        env:
          CAPYFLOW_ANDROID_FIREBASE_JSON: ${{ secrets.CAPYFLOW_ANDROID_FIREBASE_JSON }}
        run: |
          if [ -n "$CAPYFLOW_ANDROID_FIREBASE_JSON" ]; then
            printf '%s' "$CAPYFLOW_ANDROID_FIREBASE_JSON" > capyflow-android/app/google-services.json
          fi
      - name: Test and build
        env:
          CAPYFLOW_CI_KEYSTORE: ${{ github.workspace }}/.signing/capyflow-ci.jks
        working-directory: capyflow-android
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease --stacktrace
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable app/build/outputs/apk/release/app-release.apk)" = "false"
      - uses: actions/upload-artifact@v4
        with:
          name: CapyFlow-Android-1.0.8
          path: capyflow-android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CapyFlow-Android-validation
          path: |
            capyflow-android/app/build/reports/tests/
            capyflow-android/app/build/reports/lint-results-release.html

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: Test preview migration safety
        working-directory: capyflow-android
        run: node --test scripts/test-migrate-preview.mjs scripts/test-release-manifest.mjs ../firebase/push/test-plan.mjs
      - name: Test shared Firebase rules
        working-directory: firebase
        run: npm ci && npm test


  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test music backend and integrated message sender
        working-directory: backend
        run: npm install --omit=dev && npm audit --omit=dev && npm test
      - name: Package tracked backend source
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/CapyFlow-Backend.zip HEAD backend
      - uses: actions/upload-artifact@v4
        with:
          name: CapyFlow-Backend-1.0.8
          path: dist/CapyFlow-Backend.zip

  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-android-stable]')
    needs: [build, security, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: CapyFlow-Android-1.0.8
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: CapyFlow-Backend-1.0.8
          path: dist
      - name: Publish stable Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node capyflow-android/scripts/release-manifest.mjs dist/app-release.apk capyflow-android/app/build.gradle.kts dist capyflow-android/android-release-notes.txt
          tag=$(node -p "'android-dev'+require('./dist/android-update.json').versionCode")
          version=$(node -p "require('./dist/android-update.json').versionName")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/CapyFlow.apk dist/android-update.json dist/CapyFlow-Backend.zip --clobber
            gh release edit "$tag" --prerelease=false --title "CapyFlow $version" --notes-file capyflow-android/android-release-notes.txt
          else
            gh release create "$tag" dist/CapyFlow.apk dist/android-update.json dist/CapyFlow-Backend.zip --target "$GITHUB_SHA" --title "CapyFlow $version" --notes-file capyflow-android/android-release-notes.txt
          fi
      - name: Verify public in-app update download
        run: node backend/scripts/verify-android-update.mjs
