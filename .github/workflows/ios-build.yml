name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ios-port]
    paths: ['ios/**', 'backend/**', 'firebase/**', 'firebase.json', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  backend-test:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
  build:
    needs: backend-test
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Compile responsive test bundle before booting simulators
        run: |
          python3 -u ci/run_check.py --timeout 1500 --log build/layout-results/compile.log -- \
            xcodebuild -project CapyFlow.xcodeproj -scheme CapyFlow \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/layout-derived build-for-testing
      - name: Test responsive layouts on small, iPhone 13, and large screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/layout-results
          LAYOUT_STATUS=0
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; items=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")]; print(items[-1]["identifier"])')
          for SPEC in \
            'small|com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation' \
            'iphone13|com.apple.CoreSimulator.SimDeviceType.iPhone-13' \
            'large|com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max'
          do
            LABEL=${SPEC%%|*}
            DEVICE_TYPE=${SPEC#*|}
            echo "=== Starting responsive checks: ${LABEL} ==="
            UDID=$(xcrun simctl create "CapyFlow-${LABEL}" "$DEVICE_TYPE" "$RUNTIME")
            xcrun simctl boot "$UDID"
            if ! python3 -u ci/run_check.py --timeout 300 --log "build/layout-results/${LABEL}-boot.log" -- \
              xcrun simctl bootstatus "$UDID" -b; then
              LAYOUT_STATUS=1
              xcrun simctl shutdown "$UDID" || true
              xcrun simctl delete "$UDID"
              continue
            fi
            if ! python3 -u ci/run_check.py --timeout 900 --log "build/layout-results/${LABEL}-tests.log" -- xcodebuild \
              -project CapyFlow.xcodeproj \
              -scheme CapyFlow \
              -configuration Debug \
              -derivedDataPath build/layout-derived \
              -parallel-testing-enabled NO \
              -destination "platform=iOS Simulator,id=$UDID" \
              -only-testing:CapyFlowUITests/ResponsiveLayoutTests \
              -resultBundlePath "build/layout-results/${LABEL}.xcresult" \
              test-without-building; then
              LAYOUT_STATUS=1
            fi
            xcrun simctl shutdown "$UDID"
            xcrun simctl delete "$UDID"
            echo "=== Finished responsive checks: ${LABEL} ==="
          done
          exit "$LAYOUT_STATUS"
      - name: Upload responsive layout results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CapyFlow-0.4.2-layout-tests
          path: ios/build/layout-results
          if-no-files-found: warn
      - run: xcodebuild -project CapyFlow.xcodeproj -scheme CapyFlow -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify compiled app icon
        run: |
          test -f build/Build/Products/Release-iphoneos/CapyFlow.app/Assets.car
          xcrun assetutil --info build/Build/Products/Release-iphoneos/CapyFlow.app/Assets.car | grep -q AppIcon
      - name: Verify release metadata
        run: |
          APP_PLIST=build/Build/Products/Release-iphoneos/CapyFlow.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PLIST")" = "CapyFlow"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")" = "0.4.2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")" = "9"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CapyFlow.app Payload/
          zip -r CapyFlow-0.4.2-unsigned.ipa Payload
          unzip -t CapyFlow-0.4.2-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CapyFlow-0.4.2-unsigned-IPA
          path: ios/CapyFlow-0.4.2-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
