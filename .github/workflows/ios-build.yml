name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ios-port]
    paths: ['ios/**', 'backend/**', 'firebase/**', 'firebase.json', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  backend-test:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
  build:
    needs: backend-test
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project CapyFlow.xcodeproj -scheme CapyFlow -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify compiled app icon
        run: |
          test -f build/Build/Products/Release-iphoneos/CapyFlow.app/Assets.car
          xcrun assetutil --info build/Build/Products/Release-iphoneos/CapyFlow.app/Assets.car | grep -q AppIcon
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CapyFlow.app Payload/
          zip -r CapyFlow-0.4.1-unsigned.ipa Payload
          unzip -t CapyFlow-0.4.1-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CapyFlow-0.4.1-unsigned-IPA
          path: ios/CapyFlow-0.4.1-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
