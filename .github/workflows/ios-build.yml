name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ios-port]
    paths: ['ios/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project CapyFlow.xcodeproj -scheme CapyFlow -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify compiled app icon
        run: |
          test -f build/Build/Products/Release-iphoneos/CapyFlow.app/Assets.car
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' build/Build/Products/Release-iphoneos/CapyFlow.app/Info.plist | grep -x AppIcon
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CapyFlow.app Payload/
          zip -r CapyFlow-0.2.0-unsigned.ipa Payload
          unzip -t CapyFlow-0.2.0-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CapyFlow-unsigned-IPA
          path: ios/CapyFlow-0.2.0-unsigned.ipa
