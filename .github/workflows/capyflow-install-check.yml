name: Check published CapyFlow installation
on:
  push:
    branches: [feature/capyflow-android]
    paths: ['.github/workflows/capyflow-install-check.yml', '.github/scripts/capyflow-install-check.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact reported APK
        run: |
          mkdir -p install-check
          curl --fail --location --retry 3 https://github.com/sephirothkazuhakaede-hash/LastWave-Native/releases/download/android-dev13/CapyFlow.apk -o install-check/CapyFlow.apk
          echo 'fdec9d01bb1990eeefe2d3b82c68c05463bc86c99bfa323fbe1d3c155bacfe61  install-check/CapyFlow.apk' | sha256sum --check
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fresh install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash .github/scripts/capyflow-install-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-api-${{ matrix.api }}
          path: install-check/
